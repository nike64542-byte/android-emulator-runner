name: Capture APK Traffic
on: workflow_dispatch

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install mitmproxy
        run: pipx install mitmproxy

      - name: Start mitmproxy
        run: |
          mitmdump --listen-host 0.0.0.0 --listen-port 8080 -w flows.mitm &
          sleep 3

      - name: Run Emulator & Capture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim
          disable-animations: true
          script: |
            adb root
            adb wait-for-device
            adb remount

            # 安装 mitmproxy 系统证书
            HASH=$(openssl x509 -inform PEM -subject_hash_old -in ~/.mitmproxy/mitmproxy-ca-cert.pem | head -1)
            adb push ~/.mitmproxy/mitmproxy-ca-cert.pem /system/etc/security/cacerts/$HASH.0
            adb shell chmod 644 /system/etc/security/cacerts/$HASH.0
            adb reboot
            adb wait-for-device

            # 设置模拟器代理指向宿主机
            adb shell settings put global http_proxy 10.0.2.2:8080

            # 安装 APK（请替换为你的 APK 路径或下载命令）
            # adb install -r app.apk

            # 启动目标 App（请替换为真实包名）
            # adb shell monkey -p com.example.app -c android.intent.category.LAUNCHER 1

            # 抓包 60 秒
            sleep 60

            # 关闭代理
            adb shell settings put global http_proxy :0

      - uses: actions/upload-artifact@v4
        with:
          name: mitm-flows
          path: flows.mitm
